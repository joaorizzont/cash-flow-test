name: cash-flow

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=cash-flow,deployment.environment.name=local

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres-ledger:
    <<: *postgres
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: ledger
    ports:
      - '5432:5432'
    volumes:
      - ledger-data:/var/lib/postgresql/data

  postgres-daily-balance:
    <<: *postgres
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: daily_balance
    ports:
      - '5433:5432'
    volumes:
      - daily-balance-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: cashflow
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8180:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ledger:
    build:
      context: .
      args:
        SERVICE: ledger
    restart: unless-stopped
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: ledger
      PORT: 3000
      DATABASE_URL: postgres://cashflow:cashflow@postgres-ledger:5432/ledger
      AUTH_ISSUER: http://localhost:8180/realms/cash-flow
      AUTH_JWKS_URL: http://keycloak:8080/realms/cash-flow/protocol/openid-connect/certs
    ports:
      - '3001:3000'
    depends_on:
      postgres-ledger:
        condition: service_healthy

  ledger-outbox-relay:
    build:
      context: .
      args:
        SERVICE: ledger
    command: ['node', '--import', './dist/telemetry.js', 'dist/relay.js']
    restart: unless-stopped
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: ledger-outbox-relay
      PORT: 3000
      DATABASE_URL: postgres://cashflow:cashflow@postgres-ledger:5432/ledger
      RABBITMQ_URL: amqp://cashflow:cashflow@rabbitmq:5672
    depends_on:
      ledger:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  daily-balance:
    build:
      context: .
      args:
        SERVICE: daily-balance
    restart: unless-stopped
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: daily-balance
      PORT: 3000
      DATABASE_URL: postgres://cashflow:cashflow@postgres-daily-balance:5432/daily_balance
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: ${DAILY_BALANCE_RATE_LIMIT_MAX:-6000}
      AUTH_ISSUER: http://localhost:8180/realms/cash-flow
      AUTH_JWKS_URL: http://keycloak:8080/realms/cash-flow/protocol/openid-connect/certs
    ports:
      - '3002:3000'
    depends_on:
      postgres-daily-balance:
        condition: service_healthy
      redis:
        condition: service_healthy

  daily-balance-consumer:
    build:
      context: .
      args:
        SERVICE: daily-balance
    command: ['node', '--import', './dist/telemetry.js', 'dist/consumer.js']
    restart: unless-stopped
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: daily-balance-consumer
      PORT: 3000
      DATABASE_URL: postgres://cashflow:cashflow@postgres-daily-balance:5432/daily_balance
      RABBITMQ_URL: amqp://cashflow:cashflow@rabbitmq:5672
    depends_on:
      daily-balance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ['--config=/etc/otelcol/config.yaml']
    restart: unless-stopped
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318'
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'

  tempo:
    image: grafana/tempo:2.9.0
    command: ['-config.file=/etc/tempo/tempo.yaml']
    restart: unless-stopped
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  loki:
    image: grafana/loki:3.5.8
    command: ['-config.file=/etc/loki/local-config.yaml']
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cash-flow.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - tempo
      - loki

  k6:
    image: grafana/k6:1.4.2
    profiles: ['tools']
    volumes:
      - ./tests:/scripts:ro
      - ./tests/results:/results

volumes:
  ledger-data:
  daily-balance-data:
  rabbitmq-data:
  prometheus-data:
